<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08090c;
    --text: #f5f5f0;
    --dim: rgba(245,245,240,0.6);
    --rule: rgba(245,245,240,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
  }
  .wrap {
    padding: 88px 96px;
    width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .name {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 136px;
    line-height: 0.9;
    letter-spacing: -0.03em;
    color: var(--text);
  }
  .role {
    margin-top: 20px;
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 34px;
    line-height: 1.25;
    color: rgba(245,245,240,0.85);
    letter-spacing: -0.01em;
    max-width: 900px;
  }
  .colophon {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 10px 32px;
    padding-top: 28px;
    border-top: 1px solid var(--rule);
    font-size: 20px;
    line-height: 1.4;
  }
  .colophon dt {
    color: var(--dim);
    font-weight: 400;
  }
  .colophon dd {
    color: rgba(245,245,240,0.92);
    font-weight: 400;
  }
  .site {
    position: absolute;
    right: 96px; bottom: 88px;
    font-size: 18px;
    color: var(--dim);
    letter-spacing: 0.01em;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <h1 class="name">Varun Shukla</h1>
      <p class="role">Full-stack and AI engineer. Ships products that hold up and earn.</p>
    </div>
    <dl class="colophon">
      <dt>Shipping</dt>
      <dd>Bounty Index: 1,160+ programs indexed daily</dd>
      <dt>Working</dt>
      <dd>Flux Fortify (Oman), remote</dd>
      <dt>Based</dt>
      <dd>Raipur, India</dd>
    </dl>
  </div>
  <div class="site">varuncodes.tech</div>
</body>
</html>
